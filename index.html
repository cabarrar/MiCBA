<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCBA</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 30px;
        }

        header {
            padding: 30px 20px 20px;
            text-align: center;
        }

        h1 {
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }

        .container {
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            color: var(--text-main);
        }

        .card:active {
            transform: scale(0.98);
            background: #253346;
        }

        .icon {
            font-size: 1.4rem;
            background: #0f172a;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 38px;
        }

        .card-text strong {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .card-text p {
            margin: 3px 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            margin: 15px 0 4px 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MiCBA</h1>
    </header>

    <div class="container">

        <div class="section-title">📺 VÍDEOS Y ENTRETENIMIENTO</div>

        <!-- RAÚL CIMAS -->
        <a href="https://www.youtube.com/results?search_query=raul+cimas" target="_blank" class="card">
            <div class="icon">🎭</div>
            <div class="card-text">
                <strong>Raúl Cimas</strong>
                <p>Protocolo Risas en YouTube</p>
            </div>
        </a>

        <!-- RESÚMENES LALIGA -->
        <a href="https://www.youtube.com/results?search_query=resumenes+laliga+ea+sports" target="_blank" class="card">
            <div class="icon">⚽</div>
            <div class="card-text">
                <strong>Resúmenes LaLiga</strong>
                <p>Últimos partidos en YouTube</p>
            </div>
        </a>

        <div class="section-title">🎮 JUEGOS</div>

        <!-- JUEGO 1: TETRIS -->
        <a href="https://chvin.github.io/react-tetris/" target="_blank" class="card">
            <div class="icon">🧩</div>
            <div class="card-text">
                <strong>Tetris Classic</strong>
                <p>Jugar en la web</p>
            </div>
        </a>

        <!-- JUEGO 2: SNAKE -->
        <a href="https://playsnake.org/" target="_blank" class="card">
            <div class="icon">🐍</div>
            <div class="card-text">
                <strong>Snake Classic</strong>
                <p>Jugar en la web</p>
            </div>
        </a>

        <div class="section-title">📰 PRENSA</div>

        <!-- NOTICIAS -->
        <a href="https://huelvainformacion.es" target="_blank" class="card">
            <div class="icon">📰</div>
            <div class="card-text">
                <strong>Huelva Información</strong>
                <p>Noticias locales</p>
            </div>
        </a>

        <a href="https://elcorreoweb.es" target="_blank" class="card">
            <div class="icon">📰</div>
            <div class="card-text">
                <strong>El Correo de Andalucía</strong>
                <p>Actualidad regional</p>
            </div>
        </a>

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW listo', reg))
                    .catch(err => console.log('Error SW', err));
            });
        }
    </script>

</body>
</html>
