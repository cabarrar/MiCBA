<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCBA</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0221">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
            --bg: #0d0221;
            --card-bg: rgba(26, 11, 46, 0.9);
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 30px;
            background-image: 
                linear-gradient(rgba(255, 0, 127, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            padding: 30px 20px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            text-shadow: 2px 2px 0 var(--neon-pink);
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 4px;
        }

        .container {
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s ease;
            text-decoration: none;
            color: white;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }

        .card:active {
            transform: scale(0.97);
            border-color: var(--neon-pink);
        }

        .icon {
            font-size: 1.5rem;
            background: #000;
            padding: 10px;
            border: 1px solid var(--neon-pink);
            border-radius: 5px;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
        }

        .card-text strong {
            display: block;
            font-size: 1rem;
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
        }

        .card-text p {
            margin: 4px 0 0;
            font-size: 0.8rem;
            color: #ccc;
        }

        /* Sección de Juego Embebido */
        .game-container {
            display: none;
            flex-direction: column;
            background: var(--card-bg);
            border: 2px solid var(--neon-pink);
            border-radius: 8px;
            overflow: hidden;
            margin-top: -5px;
        }

        .game-container iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        /* Sección de Noticias RSS */
        .news-box {
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 8px;
            padding: 15px;
        }

        .news-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--neon-pink);
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.8rem;
        }

        .news-item {
            padding: 8px 0;
            border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-item a {
            color: #fff;
            text-decoration: none;
            display: block;
            line-height: 1.3;
        }

        .news-item a:hover {
            color: var(--neon-blue);
        }
    </style>
</head>
<body>

    <header>
        <h1>MiCBA</h1>
    </header>

    <div class="container">

        <!-- 1. TARJETA RAÚL CIMAS -->
        <a href="https://www.youtube.com/results?search_query=raul+cimas" target="_blank" class="card">
            <div class="icon">🕹️</div>
            <div class="card-text">
                <strong>RAÚL CIMAS</strong>
                <p>Protocolo Risas / YouTube</p>
            </div>
        </a>

        <!-- 2. JUEGO RETRO EMBEBIDO (TETRIS) -->
        <div class="card" onclick="toggleGame()">
            <div class="icon">👾</div>
            <div class="card-text">
                <strong>TETRIS RETRO</strong>
                <p>Toca para Jugar dentro de la App</p>
            </div>
        </div>
        <div id="gameBox" class="game-container">
            <iframe src="https://chvin.github.io/react-tetris/" title="Tetris Retro"></iframe>
        </div>

        <!-- 3. SECCIÓN NOTICIAS RSS EN TIEMPO REAL -->
        <div class="news-box">
            <h2>📡 ÚLTIMA HORA NOTICIAS</h2>
            <ul id="newsList" class="news-list">
                <li class="news-item">Cargando noticias...</li>
            </ul>
        </div>

    </div>

    <!-- CÓDIGO INTERACTIVO Y SERVICE WORKER -->
    <script>
        // Desplegar/Ocultar el juego
        function toggleGame() {
            const box = document.getElementById('gameBox');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        // Lector de Noticias RSS (Google News España / Andalucía)
        async function loadNews() {
            const rssUrl = 'https://news.google.com/rss?hl=es&gl=ES&ceid=ES:es';
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            const list = document.getElementById('newsList');

            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                list.innerHTML = '';
                
                // Mostrar los primeros 4 titulares
                data.items.slice(0, 4).forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'news-item';
                    li.innerHTML = `<a href="${item.link}" target="_blank">▸ ${item.title}</a>`;
                    list.appendChild(li);
                });
            } catch (err) {
                list.innerHTML = '<li class="news-item">No se pudieron cargar las noticias.</li>';
            }
        }

        // Cargar noticias al iniciar
        loadNews();

        // Registro de Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW listo', reg))
                    .catch(err => console.log('Error SW', err));
            });
        }
    </script>

</body>
</html>
