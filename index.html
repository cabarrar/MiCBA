<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCBA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0221">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --neon-pink: #ff007f; --neon-blue: #00f3ff; --bg: #0d0221; }
        body { font-family: 'Roboto Mono', monospace; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; background-image: linear-gradient(rgba(255,0,127,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,243,255,0.1) 1px, transparent 1px); background-size: 30px 30px; }
        header { padding: 40px; text-align: center; }
        h1 { font-family: 'Orbitron'; color: var(--neon-blue); text-shadow: 2px 2px 0 var(--neon-pink); font-size: 2.5rem; margin: 0; }
        .container { width: 90%; max-width: 400px; display: grid; gap: 20px; }
        .card { background: rgba(26,11,46,0.9); border: 2px solid var(--neon-blue); border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .icon { font-size: 1.5rem; background: #000; padding: 10px; border: 1px solid var(--neon-pink); border-radius: 5px; }
    </style>
</head>
<body>
    <header><h1>MiCBA</h1></header>
    <div class="container">
        <div class="card" onclick="window.location.href='https://www.youtube.com/results?search_query=raul+cimas'">
            <div class="icon">🕹️</div><div><strong>RAÚL CIMAS</strong><p style="margin:5px 0 0; font-size:0.8rem; color:#aaa;">PROTOCOLO RISAS</p></div>
        </div>
        <div class="card" onclick="window.location.href='https://www.google.com/search?q=noticias+Huelva+Sevilla+España&tbm=nws'">
            <div class="icon">📡</div><div><strong>NOTICIAS</strong><p style="margin:5px 0 0; font-size:0.8rem; color:#aaa;">Huelva / Sevilla / España</p></div>
        </div>
    </div>
    <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }</script>
</body>
</html>
