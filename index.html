<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCBA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            min-height: 100vh;
            padding: 24px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            border-bottom: 1px solid #00ff41;
            padding-bottom: 12px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            opacity: 0.8;
        }

        .logo {
            font-size: 2rem;
            letter-spacing: 6px;
            color: #00ff41;
        }

        #clock { font-size: 1.1rem; opacity: 0.6; }

        .prompt {
            margin-bottom: 20px;
            opacity: 0.5;
            font-size: 1rem;
        }

        .menu { display: flex; flex-direction: column; gap: 2px; }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 8px;
            text-decoration: none;
            color: #00ff41;
            border-left: 3px solid transparent;
            transition: border-color 0.1s, background 0.1s;
        }

        .item:hover, .item:focus {
            border-left-color: #00ff41;
            background: rgba(0,255,65,0.07);
            outline: none;
        }

        .item:active { background: rgba(0,255,65,0.15); }

        .item .n {
            color: rgba(0,255,65,0.4);
            min-width: 24px;
            font-size: 1rem;
        }

        .item .emoji { font-size: 1.2rem; }

        .item .text strong {
            display: block;
            letter-spacing: 2px;
            font-size: 1.2rem;
        }

        .item .text span {
            font-size: 0.9rem;
            opacity: 0.45;
        }

        .footer {
            margin-top: 28px;
            border-top: 1px solid rgba(0,255,65,0.2);
            padding-top: 10px;
            font-size: 0.9rem;
            opacity: 0.3;
        }

        .cursor {
            display: inline-block;
            width: 9px; height: 1em;
            background: #00ff41;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
</head>
<body>

    <div class="header">
        <span class="logo">MiCBA</span>
        <span id="clock"></span>
    </div>

    <div class="prompt">C:\MICBA&gt; <span class="cursor"></span></div>

    <nav class="menu">
        <a href="https://www.youtube.com/results?search_query=raul+cimas" class="item">
            <span class="n">01</span>
            <span class="emoji">🕹️</span>
            <span class="text">
                <strong>RAUL CIMAS</strong>
                <span>Protocolo Risas · YouTube</span>
            </span>
        </a>
        <a href="https://www.google.com/search?q=noticias+Huelva+Sevilla+España&tbm=nws" class="item">
            <span class="n">02</span>
            <span class="emoji">📡</span>
            <span class="text">
                <strong>NOTICIAS</strong>
                <span>Huelva / Sevilla / España</span>
            </span>
        </a>
        <a href="https://www.youtube.com/@LaLiga/videos" class="item">
            <span class="n">03</span>
            <span class="emoji">⚽</span>
            <span class="text">
                <strong>LALIGA</strong>
                <span>Resúmenes · YouTube</span>
            </span>
        </a>
    </nav>

    <div class="footer">MiCBA OS © 2026 — Huelva, España</div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                [now.getHours(), now.getMinutes(), now.getSeconds()]
                .map(n => String(n).padStart(2,'0')).join(':');
        }
        updateClock(); setInterval(updateClock, 1000);

        const items = document.querySelectorAll('.item');
        let idx = -1;
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown') { idx = Math.min(idx+1, items.length-1); items[idx].focus(); }
            else if (e.key === 'ArrowUp') { idx = Math.max(idx-1, 0); items[idx].focus(); }
            else if (e.key === '1') items[0].click();
            else if (e.key === '2') items[1].click();
            else if (e.key === '3') items[2].click();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
